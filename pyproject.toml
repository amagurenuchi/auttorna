[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stepmania-vision-bot"
version = "0.1.0"
description = "Offline chart-driven and vision-synchronised StepMania/Etterna bot"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "simfile>=2.1",
  "numpy>=1.26",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
windows = ["dxcam>=0.0.5", "mss>=9.0"]
test = ["pytest>=8.0"]
export = ["torch>=2.2", "rfdetr>=1.0", "onnx>=1.16"]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
